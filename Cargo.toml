[package]
name = "toto-flight"
version = "0.1.0"
edition = "2024"

[features]
default = []

cpu-usage = []
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/print-defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime-ms",
    "embedded-sdmmc/defmt-log",
    "embassy-rp/defmt"
]

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
panic-probe = { version = "1.0.0" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-nb = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage-async = "0.4.1"
embedded-sdmmc = { version = "0.9.0", default-features = false }

# embassy-executor = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
# embassy-rp = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller", features = ["rp235xb", "time-driver", "unstable-pac"] }
# embassy-time = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller" }
# embassy-embedded-hal = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller" }
# embassy-sync = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller" }
# embassy-futures = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller" }
# embassy-usb = { git = "https://github.com/tact1m4n3/embassy", branch = "flight-controller" }
embassy-executor = { path = "../embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = { path = "../embassy/embassy-rp", features = ["rp235xb", "time-driver", "unstable-pac"] }
embassy-time = { path = "../embassy/embassy-time" }
embassy-embedded-hal = { path = "../embassy/embassy-embedded-hal" }
embassy-sync = { path = "../embassy/embassy-sync" }
embassy-futures = { path = "../embassy/embassy-futures" }
embassy-usb = { path = "../embassy/embassy-usb" }

pio = "0.3.0"

defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true, features = ["disable-blocking-mode"] }

static_cell = "2.1.1"
heapless = { version = "0.9.2", features = ["serde"] }
futures = { version = "0.3.32", default-features = false, features = ["async-await"] }
bitflags = "2.11.0"

fixed = "1.30.0"
libm = { version = "0.2.16", default-features = false }
num-traits = { version = "0.2.15", default-features = false, features = ["libm"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["libm", "serde-serialize-no-std"] }
uom = { version = "0.38.0", default-features = false, features = ["f32", "f64", "si", "serde"] }

ahrs = { version = "0.8.0", default-features = false }

# crsf = { version = "3.0.0", features = [], git = "https://github.com/tact1m4n3/crsf-rs" }
crsf = { path = "../crsf-rs", features = [] }
ublox = { version = "0.10.0", default-features = false, features = ["ubx_proto33"] }

ina226-tp = { version = "0.4.1", features = ["async"] }

zerocopy = { version = "0.8.48", features = ["derive"] }

sequential-storage = { version = "7.2.0", default-features = false, features = ["postcard"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard = "1.1.3"

smart-leds = "0.4.0"

[patch.crates-io]
embedded-sdmmc = { git = "https://github.com/tact1m4n3/embedded-sdmmc-rs", branch = "max_file_size_error" }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
overflow-checks = true
panic = "abort"

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "s"
overflow-checks = false
panic = "abort"

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "s"
overflow-checks = false
